name: balony-daily
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install telethon
      - name: Read Telegram
        working-directory: cloud
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python fetch.py
      - name: Save result
        run: |
          git config user.name "balony-bot"
          git config user.email "balony-bot@users.noreply.github.com"
          git add telegram_events.json state.json
          git commit -m "update events" || echo "no changes"
          git push
